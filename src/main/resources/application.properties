spring.application.name=erm

# --- KONFIGURASI MYSQL (PENGGANTI H2) ---
spring.datasource.url=jdbc:mysql://localhost:3306/db_inventaris?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- KONFIGURASI JPA & HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# --- SECURITY (Tetap gunakan yang dari dosen) ---
spring.security.user.name=admin
spring.security.user.password=admin

# --- DEV TOOLS (Tetap gunakan yang dari dosen) ---
spring.thymeleaf.cache=false
spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true

# Matikan Liquibase agar Hibernate ddl-auto bisa jalan
spring.liquibase.enabled=false