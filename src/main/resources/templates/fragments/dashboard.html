<div th:fragment="content">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Panel Kendali Inventaris</h1>
    </div>

    <div class="row">
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show border-0 shadow-sm mb-4">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    </div>

    <div class="card shadow-sm mt-4">
        <div class="card-header bg-white">
            <strong>Stok Barang (Inventaris)</strong>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Kode</th>
                        <th>Nama Barang</th>
                        <th>Stok</th>
                        <th>Harga Satuan</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="product : ${products}">
                        <td th:text="${product.code}">PROD-01</td>
                        <td th:text="${product.name}">Laptop Lenovo</td>
                        <td>
                            <span class="badge bg-primary" th:text="${product.stock}">5</span>
                        </td>
                        <td th:text="'Rp ' + ${#numbers.formatDecimal(product.price, 0, 'POINT', 0, 'POINT')}">Rp 10.000.000</td>
                        <td>
                            <a href="#" class="btn btn-sm btn-outline-info">Lihat</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(products)}">
                        <td colspan="5" class="text-center text-muted p-4">Belum ada data barang.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
