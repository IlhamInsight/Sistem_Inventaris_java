<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head th:fragment="head-tags">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet" />
    <link th:href="@{/css/custom-admin.css}" rel="stylesheet" />
    <link
      th:href="@{/css/bootstrap-icons-1.11.0/bootstrap-icons.css}"
      rel="stylesheet"
    />
    <style>
      body {
        background: #f8fafc;
        color: #0f172a;
      }
    </style>
  </head>

  <body>
    <div th:fragment="header">
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm py-2">
        <div class="container-fluid">
          <a
            class="navbar-brand fw-bold d-flex align-items-center"
            th:href="@{/}"
          >
            <span>INVENTARIS.</span>
          </a>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
              <li
                class="nav-item d-flex align-items-center"
                sec:authorize="isAuthenticated()"
              >
                <div
                  class="d-flex align-items-center me-3 border-end pe-3 border-secondary"
                >
                  <span
                    class="badge bg-primary text-uppercase px-3 py-2"
                    style="
                      font-size: 0.75rem;
                      letter-spacing: 1px;
                      font-weight: 700;
                    "
                    sec:authentication="principal.authorities[0].authority"
                  >
                    JABATAN
                  </span>
                </div>
                <form th:action="@{/logout}" method="post" class="m-0">
                  <button
                    type="submit"
                    class="btn btn-outline-danger btn-sm px-3"
                  >
                    Logout
                  </button>
                </form>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </div>
  </body>
</html>
