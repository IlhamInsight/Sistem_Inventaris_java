<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <div th:replace="~{fragments/header :: head-tags}"></div>
    <title>Manajemen Aset - Inventaris ERP</title>
  </head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container-fluid">
      <div class="row">
        <nav class="col-md-2 d-none d-md-block p-0 shadow-sm sidebar">
          <div th:replace="~{fragments/left-menu :: leftMenu}"></div>
        </nav>
        <main class="col-md-10 ms-sm-auto px-md-4 mt-4">
          <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
            <h2>Manajemen Unit Aset</h2>
            <a th:href="@{/assets/items/add}" class="btn btn-primary">
              Tambah Unit Aset
            </a>
          </div>

          <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
          <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>

          <div class="card shadow-sm border-0">
            <div class="card-body p-0">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                  <tr>
                    <th class="ps-3" style="width: 70px;">No</th>
                    <th>Nomor Seri (SN)</th>
                    <th>Nama Produk</th>
                    <th>Lokasi</th>
                    <th>Status</th>
                    <th class="text-center" style="width: 180px;">Aksi</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="item, stat : ${assetItems}">
                    <td class="ps-3 text-muted" th:text="${stat.count}">1</td>
                    <td class="fw-bold font-monospace" th:text="${item.serialNumber}">SN-123456</td>
                    <td th:text="${item.product != null ? item.product.name : '-'}">Laptop Lenovo</td>
                    <td>
                      <span class="badge bg-secondary" th:text="${item.location != null ? item.location.name : '-'}">Ruang IT</span>
                    </td>
                    <td>
                      <span th:if="${item.status == 'AVAILABLE'}" class="badge bg-success">Tersedia</span>
                      <span th:if="${item.status == 'BORROWED'}" class="badge bg-warning text-dark">Dipinjam</span>
                      <span th:if="${item.status == 'MAINTENANCE'}" class="badge bg-danger">Maintenance</span>
                      <span th:if="${item.status != 'AVAILABLE' and item.status != 'BORROWED' and item.status != 'MAINTENANCE'}" 
                            class="badge bg-info" th:text="${item.status}">Status</span>
                    </td>
                    <td class="text-center">
                      <a th:href="@{/assets/items/edit/{id}(id=${item.id})}" class="btn btn-sm btn-outline-warning me-1">
                        Edit
                      </a>
                      <a th:href="@{/assets/items/delete/{id}(id=${item.id})}" 
                         class="btn btn-sm btn-outline-danger" 
                         onclick="return confirm('Yakin ingin menghapus unit aset ini?');">
                        Hapus
                      </a>
                    </td>
                  </tr>
                  <tr th:if="${#lists.isEmpty(assetItems)}">
                    <td colspan="6" class="text-center text-muted py-4">Belum ada unit aset terdaftar.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  </body>
</html>
