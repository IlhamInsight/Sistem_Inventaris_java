<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <div th:replace="~{fragments/header :: head-tags}"></div>
    <title>Maintenance - BangOne ERP</title>
  </head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container-fluid">
      <div class="row">
        <nav class="col-md-2 d-none d-md-block p-0 shadow-sm sidebar">
          <div th:replace="~{fragments/left-menu :: leftMenu}"></div>
        </nav>

        <main class="col-md-10 ms-sm-auto px-md-4 mt-4">
          <div
            class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3"
          >
            <h2>Manajemen Maintenance</h2>

            <a th:href="@{/maintenance/logs/add}" class="btn btn-primary">
              Tambah Maintenance
            </a>
          </div>

          <div
            th:if="${errorMessage}"
            class="alert alert-danger alert-dismissible fade show"
            role="alert"
          >
            <span th:text="${errorMessage}"></span>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="alert"
            ></button>
          </div>

          <div
            th:if="${successMessage}"
            class="alert alert-success alert-dismissible fade show"
            role="alert"
          >
            <span th:text="${successMessage}"></span>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="alert"
            ></button>
          </div>

          <div class="card shadow-sm border-0">
            <div class="card-body p-0">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                  <tr>
                    <th class="ps-3">Produk</th>
                    <th>Tanggal</th>
                    <th>Supplier</th>
                    <th>Masalah</th>
                    <th>Tindakan</th>
                    <th>Biaya</th>
                    <th>Status</th>
                    <th class="text-center">Aksi</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="m : ${maintenances}">
                    <td
                      class="ps-3 fw-bold"
                      th:text="${m.product != null ? m.product.name : '-'}"
                    ></td>
                    <td
                      th:text="${m.maintenanceDate != null ? m.maintenanceDate : '-'}"
                    ></td>
                    <td
                      th:text="${m.supplier != null ? m.supplier.name : '-'}"
                    ></td>
                    <td
                      th:text="${m.issueDescription != null and !#strings.isEmpty(m.issueDescription) ? m.issueDescription : '-'}"
                    ></td>
                    <td
                      th:text="${m.actionTaken != null and !#strings.isEmpty(m.actionTaken) ? m.actionTaken : '-'}"
                    ></td>
                    <td th:text="${m.cost != null ? m.cost : 0}"></td>
                    <td>
                      <span
                        class="badge"
                        th:classappend="${m.status == 'DONE' ? 'bg-success' : (m.status == 'IN_PROGRESS' ? 'bg-warning text-dark' : 'bg-secondary')}"
                        th:text="${m.status != null ? m.status : 'PENDING'}"
                      ></span>
                    </td>

                    <td class="text-center">
                      <div
                        class="d-flex justify-content-center flex-wrap gap-1"
                      >
                        <a
                          th:if="${isAdminOrStaff or (isKaryawan and m.status == 'PENDING')}"
                          th:href="@{/maintenance/logs/edit/{id}(id=${m.id})}"
                          class="btn btn-sm btn-outline-warning"
                        >
                          Edit
                        </a>

                        <a
                          th:if="${isAdminOrStaff}"
                          th:href="@{/maintenance/logs/delete/{id}(id=${m.id})}"
                          class="btn btn-sm btn-outline-danger"
                          onclick="
                            return confirm(
                              'Yakin mau hapus data maintenance ini?',
                            );
                          "
                        >
                          Hapus
                        </a>
                      </div>
                    </td>
                  </tr>

                  <tr th:if="${#lists.isEmpty(maintenances)}">
                    <td colspan="8" class="text-center py-4 text-muted">
                      Belum ada data maintenance.
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  </body>
</html>
