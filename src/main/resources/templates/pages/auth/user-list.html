<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <div th:replace="~{fragments/header :: head-tags}"></div>
    <title>Manajemen User - BangOne ERP</title>
  </head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container-fluid">
      <div class="row">
        <nav class="col-md-2 d-none d-md-block p-0 shadow-sm sidebar">
          <div th:replace="~{fragments/left-menu :: leftMenu}"></div>
        </nav>

        <main class="col-md-10 ms-sm-auto px-md-4 mt-4">
          <div
            class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3"
          >
            <h2>Manajemen User</h2>
            <a th:href="@{/auth/users/add}" class="btn btn-primary">
              Tambah User
            </a>
          </div>

          <div class="card shadow-sm border-0 mt-3">
            <div class="card-body p-0">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                  <tr>
                    <th class="ps-3">Username</th>
                    <th>Nama Karyawan</th>
                    <th>Jabatan</th>
                    <th class="text-center">Aksi</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="u : ${users}">
                    <td class="ps-3 fw-bold" th:text="${u.username}"></td>
                    <td
                      th:text="${u.employee != null ? u.employee.name : 'Tidak Terikat'}"
                    ></td>

                    <td>
                      <span
                        th:if="${u.employee != null}"
                        class="text-muted"
                        th:text="${u.employee.jobTitle}"
                      ></span>
                      <span
                        th:unless="${u.employee != null}"
                        class="text-danger small italic"
                        >-</span
                      >
                    </td>

                    <td class="text-center">
                      <a
                        th:href="@{/auth/users/edit/{id}(id=${u.id})}"
                        class="btn btn-sm btn-outline-warning me-1"
                      >
                        Edit
                      </a>

                      <a
                        th:if="${#authentication.name != u.username}"
                        th:href="@{/auth/users/delete/{id}(id=${u.id})}"
                        class="btn btn-sm btn-outline-danger"
                        onclick="return confirm('Yakin mau hapus user ini?');"
                      >
                        Hapus
                      </a>

                      <span
                        th:if="${#authentication.name == u.username}"
                        class="badge bg-secondary px-2 py-2"
                      >
                        Akun Anda
                      </span>
                    </td>
                  </tr>

                  <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="4" class="text-center py-4 text-muted">
                      Belum ada user yang terdaftar.
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  </body>
</html>
