<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <div th:replace="~{fragments/header :: head-tags}"></div>
    <title>Form Karyawan - BangOne ERP</title>
  </head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container-fluid">
      <div class="row">
        <nav class="col-md-2 d-none d-md-block p-0 shadow-sm sidebar">
          <div th:replace="~{fragments/left-menu :: leftMenu}"></div>
        </nav>
        <main class="col-md-10 ms-sm-auto px-md-4 mt-4">
          <div
            class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3"
          >
            <h2
              th:text="${employee.id == null ? 'Tambah Karyawan' : 'Edit Karyawan'}"
            ></h2>
          </div>

          <div class="card shadow-sm border-0 mt-3">
            <div class="card-body">
              <form
                th:action="@{/auth/employees/save}"
                th:object="${employee}"
                method="post"
              >
                <input type="hidden" th:field="*{id}" />

                <div class="row mb-3">
                  <div class="col-md-6">
                    <label class="form-label fw-bold">Nama Lengkap</label>
                    <input
                      type="text"
                      th:field="*{name}"
                      class="form-control"
                      placeholder="Nama Karyawan"
                      required
                    />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-bold">Jabatan</label>
                    <select th:field="*{jobTitle}" class="form-select" required>
                      <option value="" disabled selected>
                        -- Pilih Jabatan --
                      </option>
                      <option value="ADMIN">Administrator</option>
                      <option value="STAFF_GUDANG">Staff Gudang</option>
                      <option value="KARYAWAN">Karyawan</option>
                    </select>
                  </div>
                </div>

                <div class="row mb-3">
                  <div class="col-md-6">
                    <label class="form-label fw-bold">Departemen</label>
                    <select th:field="*{department.id}" class="form-select">
                      <option value="">-- Pilih Departemen (Opsional) --</option>
                      <option th:each="dept : ${departments}" 
                              th:value="${dept.id}" 
                              th:text="${dept.name}"
                              th:selected="${employee.department != null and employee.department.id == dept.id}">
                      </option>
                    </select>
                  </div>
                </div>

                <div class="d-flex justify-content-end gap-2 border-top pt-3">
                  <a th:href="@{/auth/employees}" class="btn btn-secondary"
                    >Batal</a
                  >
                  <button type="submit" class="btn btn-primary px-4">
                    Simpan Karyawan
                  </button>
                </div>
              </form>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  </body>
</html>
