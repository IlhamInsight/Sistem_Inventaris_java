<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <div th:replace="~{fragments/header :: head-tags}"></div>
    <title>Form Unit - BangOne ERP</title>
  </head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container-fluid">
      <div class="row">
        <nav class="col-md-2 d-none d-md-block p-0 shadow-sm sidebar">
          <div th:replace="~{fragments/left-menu :: leftMenu}"></div>
        </nav>

        <main class="col-md-10 ms-sm-auto px-md-4 mt-4">
          <div class="border-bottom pb-2 mb-4">
            <h2
              class="h3 fw-bold"
              th:text="${unit.id == null ? 'Tambah Unit Baru' : 'Edit Unit'}"
            ></h2>
          </div>

          <div
            th:if="${error}"
            class="alert alert-danger"
            th:text="${error}"
          ></div>

          <div class="card shadow-sm border-0">
            <div class="card-body p-4">
              <form th:action="@{/inventory/units/save}" method="post">
                <input type="hidden" name="id" th:value="${unit.id}" />

                <div class="row mb-3">
                  <div class="col-md-6">
                    <label class="form-label fw-bold">
                      Nama Unit <span class="text-danger">*</span>
                    </label>
                    <input
                      type="text"
                      name="name"
                      th:value="${unit.name}"
                      class="form-control"
                      placeholder="Contoh: Pieces, Box Besar, Rim Kertas"
                      required
                    />
                    <small class="text-muted">
                      Kode unit akan otomatis dibuat dari nama.
                    </small>
                  </div>

                  <!-- Tampilkan kode saat edit, readonly -->
                  <div class="col-md-6" th:if="${unit.id != null}">
                    <label class="form-label fw-bold">Kode Unit</label>
                    <input
                      type="text"
                      class="form-control"
                      th:value="${unit.code}"
                      readonly
                    />
                    <small class="text-muted"
                      >Kode tidak bisa diubah manual.</small
                    >
                  </div>
                </div>

                <div class="d-flex justify-content-end gap-2 border-top pt-3">
                  <a
                    th:href="@{/inventory/units}"
                    class="btn btn-secondary px-4"
                    >Batal</a
                  >
                  <button type="submit" class="btn btn-primary px-4">
                    Simpan Unit
                  </button>
                </div>
              </form>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  </body>
</html>
