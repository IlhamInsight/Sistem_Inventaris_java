<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <div th:replace="~{fragments/header :: head-tags}"></div>
    <title>Form Produk - Inventaris BangOne</title>
  </head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container-fluid">
      <div class="row">
        <nav class="col-md-2 d-none d-md-block p-0 shadow-sm sidebar">
          <div th:replace="~{fragments/left-menu :: leftMenu}"></div>
        </nav>

        <main class="col-md-10 ms-sm-auto px-md-4 mt-4">
          <div
            class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3"
          >
            <h2
              th:text="${product.id == null ? 'Tambah Produk Baru' : 'Edit Produk'}"
            ></h2>
          </div>

          <div class="card shadow-sm border-0 mt-3">
            <div class="card-body">
              <form
                th:action="@{/inventory/products/save}"
                th:object="${product}"
                method="post"
              >
                <input type="hidden" th:field="*{id}" />

                <div class="row mb-3">
                  <div class="col-md-6">
                    <label class="form-label fw-bold">Kode Barang</label>
                    <input
                      type="text"
                      th:field="*{code}"
                      class="form-control bg-light"
                      readonly
                    />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-bold">Nama Barang</label>
                    <input
                      type="text"
                      th:field="*{name}"
                      class="form-control"
                      placeholder="Nama Lengkap Barang"
                      required
                    />
                  </div>
                </div>

                <div class="row mb-3">
                  <div class="col-md-6">
                    <label class="form-label fw-bold">Brand / Merk</label>
                    <select th:field="*{brand}" class="form-select" required>
                      <option value="">-- Pilih Brand --</option>
                      <option
                        th:each="b : ${brands}"
                        th:value="${b.id}"
                        th:text="${b.name}"
                      ></option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-bold">Kategori</label>
                    <select th:field="*{category}" class="form-select" required>
                      <option value="">-- Pilih Kategori --</option>
                      <option
                        th:each="cat : ${categories}"
                        th:value="${cat.id}"
                        th:text="${cat.name}"
                      ></option>
                    </select>
                  </div>
                </div>

                <div class="row mb-4">
                  <div class="col-md-6">
                    <label class="form-label fw-bold">Harga Satuan</label>
                    <div class="input-group">
                      <span class="input-group-text">Rp</span>
                      <input
                        type="number"
                        th:field="*{price}"
                        th:value="${#numbers.formatDecimal(product.price, 0, 0)}"
                        class="form-control"
                        step="1"
                        placeholder="0"
                        required
                      />
                    </div>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-bold">Stok Awal</label>
                    <input
                      type="number"
                      th:field="*{stock}"
                      class="form-control"
                      required
                    />
                  </div>
                </div>

                <div class="d-flex justify-content-end gap-2 border-top pt-3">
                  <a th:href="@{/inventory/products}" class="btn btn-secondary"
                    >Batal</a
                  >
                  <button type="submit" class="btn btn-primary px-4">
                    Simpan Data
                  </button>
                </div>
              </form>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  </body>
</html>
