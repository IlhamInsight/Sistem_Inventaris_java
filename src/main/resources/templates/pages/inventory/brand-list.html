<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <div th:replace="~{fragments/header :: head-tags}"></div>
    <title>Brand / Merk - BangOne ERP</title>
  </head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container-fluid">
      <div class="row">
        <nav class="col-md-2 d-none d-md-block p-0 shadow-sm sidebar">
          <div th:replace="~{fragments/left-menu :: leftMenu}"></div>
        </nav>

        <main class="col-md-10 ms-sm-auto px-md-4 mt-4">
          <div
            class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3"
          >
            <h2>Manajemen Brand / Merk</h2>
            <a th:href="@{/inventory/brands/add}" class="btn btn-primary">
              Tambah Brand
            </a>
          </div>

          <!-- Flash Message Success -->
          <div
            th:if="${success}"
            class="alert alert-success alert-dismissible fade show"
            role="alert"
          >
            <span th:text="${success}"></span>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="alert"
              aria-label="Close"
            ></button>
          </div>

          <!-- Flash Message Error -->
          <div
            th:if="${error}"
            class="alert alert-danger alert-dismissible fade show"
            role="alert"
          >
            <span th:text="${error}"></span>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="alert"
              aria-label="Close"
            ></button>
          </div>

          <div class="card shadow-sm border-0">
            <div class="card-body p-0">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                  <tr>
                    <th class="ps-3">Nama Brand</th>
                    <th>Keterangan</th>
                    <th class="text-center">Aksi</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="b : ${brands}">
                    <td class="ps-3 fw-bold" th:text="${b.name}"></td>
                    <td th:text="${b.description}"></td>
                    <td class="text-center">
                      <a
                        th:href="@{/inventory/brands/edit/{id}(id=${b.id})}"
                        class="btn btn-sm btn-outline-warning me-1"
                      >
                        Edit
                      </a>

                      <!-- Jika brand TIDAK dipakai -->
                      <a
                        th:if="${!brandUsedMap[b.id]}"
                        th:href="@{/inventory/brands/delete/{id}(id=${b.id})}"
                        class="btn btn-sm btn-outline-danger"
                        onclick="return confirm('Yakin mau hapus brand ini?');"
                      >
                        Hapus
                      </a>

                      <!-- Jika brand sedang dipakai -->
                      <button
                        th:if="${brandUsedMap[b.id]}"
                        type="button"
                        class="btn btn-sm btn-success"
                        disabled
                      >
                        Brand Sedang Digunakan
                      </button>
                    </td>
                  </tr>

                  <tr th:if="${#lists.isEmpty(brands)}">
                    <td colspan="3" class="text-center py-4 text-muted">
                      Belum ada data brand.
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  </body>
</html>
