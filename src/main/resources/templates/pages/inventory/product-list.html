<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <div th:replace="~{fragments/header :: head-tags}"></div>
    <title>Daftar Produk - Inventaris BangOne</title>
  </head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container-fluid">
      <div class="row">
        <nav class="col-md-2 d-none d-md-block p-0 shadow-sm sidebar">
          <div th:replace="~{fragments/left-menu :: leftMenu}"></div>
        </nav>

        <main class="col-md-10 ms-sm-auto px-md-4 mt-4">
          <div
            class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3"
          >
            <h2>Manajemen Stok Produk</h2>
            <a th:href="@{/inventory/products/add}" class="btn btn-primary">
              Tambah Barang Baru
            </a>
          </div>

          <div class="card shadow-sm border-0">
            <div class="card-body p-0">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                  <tr>
                    <th class="ps-3">Kode</th>
                    <th>Nama Barang</th>
                    <th>Brand</th>
                    <th>Kategori</th>
                    <th>Stok</th>
                    <th>Harga Satuan</th>
                    <th class="text-center">Aksi</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="p : ${products}">
                    <td class="ps-3 fw-bold" th:text="${p.code}"></td>
                    <td th:text="${p.name}"></td>
                    <td th:text="${p.brand?.name ?: '-'}"></td>
                    <td th:text="${p.category?.name ?: '-'}"></td>
                    <td>
                      <span class="badge bg-primary px-3" th:text="${p.stock}"
                        >0</span
                      >
                    </td>
                    <td
                      th:text="'Rp ' + ${#numbers.formatDecimal(p.price, 0, 'POINT', 0, 'POINT')}"
                    ></td>
                    <td class="text-center">
                      <a
                        th:href="@{/inventory/products/edit/{id}(id=${p.id})}"
                        class="btn btn-sm btn-outline-warning"
                      >
                        Edit</a>
                      <a
                        th:href="@{/inventory/products/delete/{id}(id=${p.id})}"
                        class="btn btn-sm btn-outline-danger"
                        onclick="
                          return confirm('Yakin ingin menghapus produk ini?');
                        "
                      >
                        Hapus</a>
                    </td>
                  </tr>
                  <tr th:if="${#lists.isEmpty(products)}">
                    <td colspan="7" class="text-center p-4 text-muted">
                      Belum ada data produk.
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  </body>
</html>
