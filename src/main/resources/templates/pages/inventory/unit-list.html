<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <div th:replace="~{fragments/header :: head-tags}"></div>
    <title>Satuan Unit - BangOne ERP</title>
  </head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container-fluid">
      <div class="row">
        <nav class="col-md-2 d-none d-md-block p-0 shadow-sm sidebar">
          <div th:replace="~{fragments/left-menu :: leftMenu}"></div>
        </nav>

        <main class="col-md-10 ms-sm-auto px-md-4 mt-4">
          <div
            class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-4"
          >
            <h2 class="h3 fw-bold">Satuan Unit</h2>
            <a th:href="@{/inventory/units/add}" class="btn btn-primary">
              Tambah Unit
            </a>
          </div>

          <div
            th:if="${success}"
            class="alert alert-success alert-dismissible fade show"
          >
            <span th:text="${success}"></span>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="alert"
            ></button>
          </div>
          <div
            th:if="${error}"
            class="alert alert-danger alert-dismissible fade show"
          >
            <span th:text="${error}"></span>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="alert"
            ></button>
          </div>

          <div class="card shadow-sm border-0">
            <div class="card-body p-0">
              <table class="table table-hover mb-0">
                <thead class="table-dark">
                  <tr>
                    <th>#</th>
                    <th>Nama Unit</th>
                    <th>Kode</th>
                    <th class="text-center">Aksi</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:if="${#lists.isEmpty(units)}">
                    <td colspan="4" class="text-center text-muted py-4">
                      Belum ada data unit.
                    </td>
                  </tr>
                  <tr th:each="unit, stat : ${units}">
                    <td th:text="${stat.count}"></td>
                    <td th:text="${unit.name}"></td>
                    <td>
                      <span
                        class="badge bg-secondary"
                        th:text="${unit.code}"
                      ></span>
                    </td>
                    <td class="text-center">
                      <a
                        th:href="@{/inventory/units/edit/{id}(id=${unit.id})}"
                        class="btn btn-sm btn-warning me-1"
                      >
                        Edit
                      </a>
                      <a
                        th:href="@{/inventory/units/delete/{id}(id=${unit.id})}"
                        class="btn btn-sm btn-danger"
                        onclick="return confirm('Yakin hapus unit ini?');"
                      >
                        Hapus
                      </a>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  </body>
</html>
