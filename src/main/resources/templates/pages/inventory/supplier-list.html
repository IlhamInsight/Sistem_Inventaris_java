<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <div th:replace="~{fragments/header :: head-tags}"></div>
    <title>Supplier - BangOne ERP</title>
  </head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container-fluid">
      <div class="row">
        <nav class="col-md-2 d-none d-md-block p-0 shadow-sm sidebar">
          <div th:replace="~{fragments/left-menu :: leftMenu}"></div>
        </nav>

        <main class="col-md-10 ms-sm-auto px-md-4 mt-4">
          <div
            class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3"
          >
            <h2>Manajemen Supplier</h2>

            <a th:href="@{/inventory/suppliers/add}" class="btn btn-primary">
              Tambah Supplier
            </a>
          </div>

          <div
            th:if="${errorMessage}"
            class="alert alert-danger alert-dismissible fade show"
            role="alert"
          >
            <span th:text="${errorMessage}"></span>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="alert"
            ></button>
          </div>

          <div
            th:if="${successMessage}"
            class="alert alert-success alert-dismissible fade show"
            role="alert"
          >
            <span th:text="${successMessage}"></span>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="alert"
            ></button>
          </div>

          <div class="card shadow-sm border-0">
            <div class="card-body p-0">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                  <tr>
                    <th class="ps-3">Nama Supplier</th>
                    <th>Kode Supplier</th>
                    <th>Contact Person</th>
                    <th>No. Telepon</th>
                    <th>Email</th>
                    <th>Alamat</th>
                    <th class="text-center">Aksi</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="s : ${suppliers}">
                    <td class="ps-3 fw-bold" th:text="${s.name}"></td>
                    <td th:text="${s.code}"></td>
                    <td th:text="${s.contactPerson}"></td>
                    <td th:text="${s.phone}"></td>
                    <td th:text="${s.email}"></td>
                    <td th:text="${s.address}"></td>
                    <td class="text-center">
                      <a
                        th:href="@{/inventory/suppliers/edit/{id}(id=${s.id})}"
                        class="btn btn-sm btn-outline-warning me-1"
                      >
                        Edit
                      </a>

                      <a
                        th:href="@{/inventory/suppliers/delete/{id}(id=${s.id})}"
                        class="btn btn-sm btn-outline-danger"
                        onclick="
                          return confirm('Yakin mau hapus supplier ini?');
                        "
                      >
                        Hapus
                      </a>
                    </td>
                  </tr>

                  <tr th:if="${#lists.isEmpty(suppliers)}">
                    <td colspan="7" class="text-center py-4 text-muted">
                      Belum ada data supplier.
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  </body>
</html>
