<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <div th:replace="~{fragments/header :: head-tags}"></div>
    <title>Peminjaman Barang - BangOne ERP</title>
  </head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container-fluid">
      <div class="row">
        <nav class="col-md-2 d-none d-md-block p-0 shadow-sm sidebar">
          <div th:replace="~{fragments/left-menu :: leftMenu}"></div>
        </nav>

        <main class="col-md-10 ms-sm-auto px-md-4 mt-4">
          <div
            class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3"
          >
            <h2>
              Manajemen Peminjaman
              Barang
            </h2>

            <a th:href="@{/loans/requests/add}" class="btn btn-primary">
              Tambah Peminjaman
            </a>
          </div>

          <div
            th:if="${errorMessage}"
            class="alert alert-danger alert-dismissible fade show"
            role="alert"
          >
            <span th:text="${errorMessage}"></span>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="alert"
            ></button>
          </div>

          <div
            th:if="${successMessage}"
            class="alert alert-success alert-dismissible fade show"
            role="alert"
          >
            <span th:text="${successMessage}"></span>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="alert"
            ></button>
          </div>

          <div class="card shadow-sm border-0">
            <div class="card-body p-0">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                  <tr>
                    <th class="ps-3">Kode Request</th>
                    <th>Nama Peminjam</th>
                    <th>Tanggal Request</th>
                    <th>Tanggal Pinjam</th>
                    <th>Jatuh Tempo</th>
                    <th>Tujuan</th>
                    <th>Status</th>
                    <th class="text-center">Aksi</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="l : ${loans}">
                    <td class="ps-3 fw-bold" th:text="${l.requestCode}"></td>
                    <td
                      th:text="${l.employee != null ? l.employee.name : '-'}"
                    ></td>
                    <td th:text="${l.requestDate}"></td>
                    <td th:text="${l.loanDate}"></td>
                    <td th:text="${l.dueDate}"></td>
                    <td th:text="${l.purpose != null ? l.purpose : '-'}"></td>
                    <td>
                      <span
                        class="badge"
                        th:classappend="${
                          l.status == 'APPROVED' ? 'bg-success' :
                          (l.status == 'REJECTED' ? 'bg-danger' :
                          (l.status == 'RETURNED' ? 'bg-info text-dark' : 'bg-warning text-dark'))
                        }"
                        th:text="${l.status}"
                      ></span>
                    </td>
                    <td class="text-center">
                      <div
                        class="d-flex justify-content-center flex-wrap gap-1"
                      >
                        <a
                          th:if="${isAdminOrStaff}"
                          th:href="@{/loans/requests/edit/{id}(id=${l.id})}"
                          class="btn btn-sm btn-outline-warning"
                        >
                          Edit
                        </a>

                        <a
                          th:if="${isAdminOrStaff}"
                          th:href="@{/loans/requests/delete/{id}(id=${l.id})}"
                          class="btn btn-sm btn-outline-danger"
                          onclick="
                            return confirm(
                              'Yakin mau hapus data peminjaman ini?',
                            );
                          "
                        >
                          Hapus
                        </a>
                      </div>
                    </td>
                  </tr>

                  <tr th:if="${#lists.isEmpty(loans)}">
                    <td colspan="8" class="text-center py-4 text-muted">
                      Belum ada data peminjaman.
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  </body>
</html>
