<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <div th:replace="~{fragments/header :: head-tags}"></div>
    <title>Form Denda - Inventaris ERP</title>
  </head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container-fluid">
      <div class="row">
        <nav class="col-md-2 d-none d-md-block p-0 shadow-sm sidebar">
          <div th:replace="~{fragments/left-menu :: leftMenu}"></div>
        </nav>
        <main class="col-md-10 ms-sm-auto px-md-4 mt-4">
          <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
            <h2 th:text="${fine.id == null ? 'Tambah Denda' : 'Edit Denda'}"></h2>
          </div>

          <div class="card shadow-sm border-0 mt-3" style="max-width: 650px;">
            <div class="card-body">
              <form th:action="@{/loans/fines/save}" th:object="${fine}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                  <label class="form-label fw-bold">Pilih Transaksi Peminjaman</label>
                  <select th:field="*{loanRequest.id}" class="form-select" required>
                    <option value="" disabled selected>-- Pilih Transaksi --</option>
                    <option th:each="l : ${loans}" 
                            th:value="${l.id}" 
                            th:text="${l.requestCode + ' - ' + (l.employee != null ? l.employee.name : 'Unknown') + ' (' + l.loanDate + ')'}"
                            th:selected="${fine.loanRequest != null and fine.loanRequest.id == l.id}">
                    </option>
                  </select>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold">Nominal Denda (Rp)</label>
                  <input type="number" th:field="*{amount}" class="form-control" placeholder="Contoh: 50000" min="0" required />
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold">Alasan Denda</label>
                  <textarea th:field="*{reason}" class="form-control" rows="3" placeholder="Contoh: Keterlambatan pengembalian 3 hari / Kerusakan charger laptop" required></textarea>
                </div>

                <div class="mb-3 form-check">
                  <input type="checkbox" th:field="*{isPaid}" class="form-check-input" id="checkPaid" />
                  <label class="form-check-label fw-bold" for="checkPaid">Sudah Lunas Dibayar?</label>
                </div>

                <div class="d-flex justify-content-end gap-2 border-top pt-3">
                  <a th:href="@{/loans/fines}" class="btn btn-secondary">Batal</a>
                  <button type="submit" class="btn btn-primary px-4">
                    Simpan Denda
                  </button>
                </div>
              </form>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  </body>
</html>
