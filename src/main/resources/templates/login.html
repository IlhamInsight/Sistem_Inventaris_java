<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - Inventaris ERP</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet" />
    <link
      th:href="@{/css/bootstrap-icons-1.11.0/bootstrap-icons.css}"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f4f7f6;
        height: 100vh;
      }
      /* Memastikan card login selalu di tengah */
      .login-container {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
      }
      .card-login {
        border: none;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="container login-container">
      <div class="row justify-content-center w-100">
        <div class="col-11 col-sm-8 col-md-6 col-lg-4">
          <div class="text-center mb-4">
            <h3 class="fw-bold mt-2">Inventaris ERP</h3>
          </div>

          <div class="card card-login">
            <div class="card-body p-4 p-md-5">
              <h5 class="text-center mb-4">Silakan Masuk</h5>

              <div th:if="${param.error}" class="alert alert-danger p-2 small">
                Username atau password salah.
              </div>

              <form th:action="@{/login}" method="post">
                <div class="mb-3">
                  <label class="form-label">Username</label>
                  <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="admin"
                    required
                  />
                </div>
                <div class="mb-4">
                  <label class="form-label">Password</label>
                  <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="*******"
                    required
                  />
                </div>
                <button
                  type="submit"
                  class="btn btn-primary w-100 py-2 fw-bold shadow-sm"
                >
                  Login </button>
              </form>
            </div>
          </div>

          <div class="text-center mt-4 text-muted small">
            &copy; 2026 Inventaris ERP Application
          </div>
        </div>
      </div>
    </div>

    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  </body>
</html>
